# ===============================================================
# lcyksp.xyz — Nginx 网关配置参考
# 部署在 Ubuntu 云服务器，作为 80 端口网关
# 前端 SPA 由 Nginx 直接托管，/api 反向代理到 Express:3000
# ===============================================================

server {
    listen 80;
    server_name lcyksp.xyz www.lcyksp.xyz 47.106.101.81;  # 域名（含 www）和公网 IP

    # 字符集
    charset utf-8;

    # ---------- 前端 SPA（Vue/Vite 构建产物）----------
    root /var/www/lcyksp/dist;  # 修改为你的实际部署路径
    index index.html;

    # SPA 路由：所有非文件/非 API 请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理到 Express 后端 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # 大文件上传/下载不超时
        proxy_send_timeout 300s;

        # 允许大文件上传（最大 2GB）
        client_max_body_size 2g;
    }

    # ---------- （可选）相册图片直接由 Nginx 托管，减少 Express 负载 ----------
    # 将 gallery 上传目录映射到 /uploads/gallery
    # 前提：前端 GalleryView.vue 中的 photo.url 需改为 /uploads/gallery/ 路径
    # 但当前版本仍使用 /api/gallery/file/ 经 Express 代理，故此段默认注释
    #
    # location /uploads/gallery/ {
    #     alias /path/to/lcyksp-backend/data/uploads/gallery/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    #     add_header Access-Control-Allow-Origin "*";
    # }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- 日志 ----------
    access_log /var/log/nginx/lcyksp-access.log;
    error_log  /var/log/nginx/lcyksp-error.log;
}
